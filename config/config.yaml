pipeline:
  idioma_destino: "es"
  formatos_subtitulos:
    - srt
    - vtt
  input_dir: "./input"
  work_dir: "./work"
  output_dir: "./output"
  hardware:
    modo: "auto"

stages:
  separation:
    model: "UVR-MDX-NET-Inst_HQ_3.onnx"
  
  transcription:
    model: "large-v3-turbo"
    language: "auto"
  
  translation:
    model: "qwen2.5:3b"
    ollama_url: "http://localhost:11434"
    temperature: 0.2
    max_retries: 3
  
  tts:
    engine: "coqui-xtts"
    model_name: "tts_models/multilingual/multi-dataset/xtts_v2"
    speaker_sample_min_s: 6
    speaker_sample_max_s: 30
    target_language: "es"
    speed: 1.0
